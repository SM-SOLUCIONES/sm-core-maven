# Schema de core-protocolo-apikey: tokens de acceso personales.
databaseChangeLog:
  # Usuarios en espanol (glosario, ticket 06). core-identity renombra auth_users a auth_usuarios antes de que corra
  # este changelog. En una base nueva este changeset crea auth_user_access_tokens con la FK hacia auth_usuarios (el
  # nombre de la FK queda [D15]) y 2026-07-06-create-initial-schema-10, que la apunta a auth_users, queda MARK_RAN por su
  # precondicion. En una base existente la tabla ya existe (su FK sigue a la tabla renombrada) y este queda MARK_RAN.
  # Su rollback no hace nada: Liquibase tambien revierte los changesets MARK_RAN, y la tabla la borra el rollback de
  # 2026-07-06-create-initial-schema-10 (en una base nueva queda MARK_RAN despues de este, asi que se revierte antes).
  - changeSet:
      id: 2026-10-09-create-auth-user-access-tokens-fk-auth-usuarios
      author: TaielMG
      comment: Crea tabla auth_user_access_tokens con la FK hacia auth_usuarios (base nueva)
      preConditions:
        - onFail: MARK_RAN
        - tableExists:
            tableName: auth_usuarios
        - not:
            - tableExists:
                tableName: auth_user_access_tokens
      changes:
        - createTable:
            tableName: auth_user_access_tokens
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
              - column:
                  name: status
                  type: TINYINT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: uuid
                  type: CHAR(36)
                  constraints:
                    nullable: false
              - column:
                  name: code
                  type: VARCHAR(255)
              - column:
                  name: active
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
              - column:
                  name: id_user_created
                  type: BIGINT
              - column:
                  name: id_user_updated
                  type: BIGINT
              - column:
                  name: id_user_deleted
                  type: BIGINT
              - column:
                  name: date_created
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: date_updated
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: date_deleted
                  type: TIMESTAMP
        - addUniqueConstraint:
            tableName: auth_user_access_tokens
            columnNames: uuid
            constraintName: uk_auth_user_access_tokens_uuid
        - addForeignKeyConstraint:
            baseTableName: auth_user_access_tokens
            baseColumnNames: user_id
            referencedTableName: auth_usuarios
            referencedColumnNames: id
            constraintName: fk_auth_user_access_tokens_user
      rollback:
        - output:
            message: Sin efecto. La tabla la borra el rollback de 2026-07-06-create-initial-schema-10

  - changeSet:
      id: 2026-07-06-create-initial-schema-10
      author: TaielMG
      comment: Crea tabla auth_user_access_tokens
      preConditions:
        onFail: MARK_RAN
        not:
          - tableExists:
              tableName: auth_user_access_tokens
      changes:
        - createTable:
            tableName: auth_user_access_tokens
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
              - column:
                  name: status
                  type: TINYINT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: uuid
                  type: CHAR(36)
                  constraints:
                    nullable: false
              - column:
                  name: code
                  type: VARCHAR(255)
              - column:
                  name: active
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
              - column:
                  name: id_user_created
                  type: BIGINT
              - column:
                  name: id_user_updated
                  type: BIGINT
              - column:
                  name: id_user_deleted
                  type: BIGINT
              - column:
                  name: date_created
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: date_updated
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: date_deleted
                  type: TIMESTAMP
        - addUniqueConstraint:
            tableName: auth_user_access_tokens
            columnNames: uuid
            constraintName: uk_auth_user_access_tokens_uuid
        - addForeignKeyConstraint:
            baseTableName: auth_user_access_tokens
            baseColumnNames: user_id
            referencedTableName: auth_users
            referencedColumnNames: id
            constraintName: fk_auth_user_access_tokens_user
      rollback:
        - dropForeignKeyConstraint:
            baseTableName: auth_user_access_tokens
            constraintName: fk_auth_user_access_tokens_user
        - dropTable:
            tableName: auth_user_access_tokens

  # Auditoria en espanol (glosario, ticket 02): auth_user_access_tokens
  - changeSet:
      id: 2026-10-09-renombrar-auditoria-auth-user-access-tokens-1
      author: TaielMG
      comment: Renombra la columna de auditoria id_user_created de auth_user_access_tokens a id_usuario_de_creacion
      preConditions:
        onFail: MARK_RAN
        columnExists:
          tableName: auth_user_access_tokens
          columnName: id_user_created
      changes:
        - sql:
            sql: ALTER TABLE auth_user_access_tokens RENAME COLUMN id_user_created TO id_usuario_de_creacion
      rollback:
        - sql:
            sql: ALTER TABLE auth_user_access_tokens RENAME COLUMN id_usuario_de_creacion TO id_user_created

  - changeSet:
      id: 2026-10-09-renombrar-auditoria-auth-user-access-tokens-2
      author: TaielMG
      comment: Renombra la columna de auditoria id_user_updated de auth_user_access_tokens a id_usuario_de_actualizacion
      preConditions:
        onFail: MARK_RAN
        columnExists:
