          columnName: id_user_updated
      changes:
        - sql:
            sql: ALTER TABLE auth_user_access_tokens RENAME COLUMN id_user_updated TO id_usuario_de_actualizacion
      rollback:
        - sql:
            sql: ALTER TABLE auth_user_access_tokens RENAME COLUMN id_usuario_de_actualizacion TO id_user_updated

  - changeSet:
      id: 2026-10-09-renombrar-auditoria-auth-user-access-tokens-3
      author: TaielMG
      comment: Renombra la columna de auditoria id_user_deleted de auth_user_access_tokens a id_usuario_de_borrado
      preConditions:
        onFail: MARK_RAN
        columnExists:
          tableName: auth_user_access_tokens
          columnName: id_user_deleted
      changes:
        - sql:
            sql: ALTER TABLE auth_user_access_tokens RENAME COLUMN id_user_deleted TO id_usuario_de_borrado
      rollback:
        - sql:
            sql: ALTER TABLE auth_user_access_tokens RENAME COLUMN id_usuario_de_borrado TO id_user_deleted

  - changeSet:
      id: 2026-10-09-renombrar-auditoria-auth-user-access-tokens-4
      author: TaielMG
      comment: Renombra la columna de auditoria date_created de auth_user_access_tokens a fecha_de_creacion
      preConditions:
        onFail: MARK_RAN
        columnExists:
          tableName: auth_user_access_tokens
          columnName: date_created
      changes:
        - sql:
            sql: ALTER TABLE auth_user_access_tokens RENAME COLUMN date_created TO fecha_de_creacion
      rollback:
        - sql:
            sql: ALTER TABLE auth_user_access_tokens RENAME COLUMN fecha_de_creacion TO date_created

  - changeSet:
      id: 2026-10-09-renombrar-auditoria-auth-user-access-tokens-5
      author: TaielMG
      comment: Renombra la columna de auditoria date_updated de auth_user_access_tokens a fecha_de_actualizacion
      preConditions:
        onFail: MARK_RAN
        columnExists:
          tableName: auth_user_access_tokens
          columnName: date_updated
      changes:
        - sql:
            sql: ALTER TABLE auth_user_access_tokens RENAME COLUMN date_updated TO fecha_de_actualizacion
      rollback:
        - sql:
            sql: ALTER TABLE auth_user_access_tokens RENAME COLUMN fecha_de_actualizacion TO date_updated

  - changeSet:
      id: 2026-10-09-renombrar-auditoria-auth-user-access-tokens-6
      author: TaielMG
      comment: Renombra la columna de auditoria date_deleted de auth_user_access_tokens a fecha_de_borrado
      preConditions:
        onFail: MARK_RAN
        columnExists:
          tableName: auth_user_access_tokens
          columnName: date_deleted
      changes:
        - sql:
            sql: ALTER TABLE auth_user_access_tokens RENAME COLUMN date_deleted TO fecha_de_borrado
      rollback:
        - sql:
            sql: ALTER TABLE auth_user_access_tokens RENAME COLUMN fecha_de_borrado TO date_deleted

  # Tokens de acceso en espanol (glosario, ticket 08). La tabla pierde el "user_" (AccessToken es termino reservado,
  # el prefijo auth_ queda [D12]) y sus columnas se traducen. PK, secuencia, unique y FK conservan su nombre [D15].
  # En una base nueva la tabla nace como auth_user_access_tokens (2026-10-09-create-auth-user-access-tokens-fk-auth-usuarios)
  # y estos changesets la renombran igual que en una base existente. Los valores de code (los tokens emitidos) no
  # cambian: un token creado antes de migrar sigue autenticando.
  - changeSet:
      id: 2026-10-09-renombrar-access-tokens-1
      author: TaielMG
      comment: Renombra la tabla auth_user_access_tokens a auth_access_tokens
      preConditions:
        - onFail: MARK_RAN
        - tableExists:
            tableName: auth_user_access_tokens
        - not:
            - tableExists:
                tableName: auth_access_tokens
      changes:
        - renameTable:
            oldTableName: auth_user_access_tokens
            newTableName: auth_access_tokens
      rollback:
        - renameTable:
            oldTableName: auth_access_tokens
            newTableName: auth_user_access_tokens

  - changeSet:
      id: 2026-10-09-renombrar-access-tokens-2
      author: TaielMG
      comment: Renombra la columna name de auth_access_tokens a nombre
      preConditions:
        onFail: MARK_RAN
        columnExists:
          tableName: auth_access_tokens
          columnName: name
      changes:
        - sql:
            sql: ALTER TABLE auth_access_tokens RENAME COLUMN name TO nombre
      rollback:
        - sql:
            sql: ALTER TABLE auth_access_tokens RENAME COLUMN nombre TO name

  - changeSet:
      id: 2026-10-09-renombrar-access-tokens-3
      author: TaielMG
      comment: Renombra la columna code de auth_access_tokens a codigo
      preConditions:
        onFail: MARK_RAN
        columnExists:
          tableName: auth_access_tokens
          columnName: code
      changes:
        - sql:
            sql: ALTER TABLE auth_access_tokens RENAME COLUMN code TO codigo
      rollback:
        - sql:
            sql: ALTER TABLE auth_access_tokens RENAME COLUMN codigo TO code

  - changeSet:
      id: 2026-10-09-renombrar-access-tokens-4
      author: TaielMG
      comment: Renombra la columna active de auth_access_tokens a activo
      preConditions:
        onFail: MARK_RAN
        columnExists:
          tableName: auth_access_tokens
          columnName: active
      changes:
        - sql:
            sql: ALTER TABLE auth_access_tokens RENAME COLUMN active TO activo
      rollback:
        - sql:
            sql: ALTER TABLE auth_access_tokens RENAME COLUMN activo TO active

  - changeSet:
      id: 2026-10-09-renombrar-access-tokens-5
      author: TaielMG
      comment: Renombra la columna user_id de auth_access_tokens a id_usuario
      preConditions:
        onFail: MARK_RAN
        columnExists:
          tableName: auth_access_tokens
          columnName: user_id
      changes:
        - sql:
            sql: ALTER TABLE auth_access_tokens RENAME COLUMN user_id TO id_usuario
      rollback:
        - sql:
            sql: ALTER TABLE auth_access_tokens RENAME COLUMN id_usuario TO user_id
