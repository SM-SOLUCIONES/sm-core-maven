              tableName: auth_roles_permissions
      changes:
        - createTable:
            tableName: auth_roles_permissions
            columns:
              - column:
                  name: role_id
                  type: BIGINT
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: permission_id
                  type: BIGINT
                  constraints:
                    primaryKey: true
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: auth_roles_permissions
            baseColumnNames: role_id
            referencedTableName: auth_roles
            referencedColumnNames: id
            constraintName: fk_auth_roles_permissions_role
        - addForeignKeyConstraint:
            baseTableName: auth_roles_permissions
            baseColumnNames: permission_id
            referencedTableName: auth_permissions
            referencedColumnNames: id
            constraintName: fk_auth_roles_permissions_permission
      rollback:
        - dropForeignKeyConstraint:
            baseTableName: auth_roles_permissions
            constraintName: fk_auth_roles_permissions_permission
        - dropForeignKeyConstraint:
            baseTableName: auth_roles_permissions
            constraintName: fk_auth_roles_permissions_role
        - dropTable:
            tableName: auth_roles_permissions


  - changeSet:
      id: 2026-07-06-create-initial-schema-9
      author: TaielMG
      comment: Crea tabla security_code
      preConditions:
        onFail: MARK_RAN
        not:
          - tableExists:
              tableName: security_code
      changes:
        - createTable:
            tableName: security_code
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: code
                  type: VARCHAR(255)
              - column:
                  name: status
                  type: TINYINT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: uuid
                  type: CHAR(36)
                  constraints:
                    nullable: false
              - column:
                  name: purpose
                  type: VARCHAR(255)
              - column:
                  name: used
                  type: TINYINT(1)
              - column:
                  name: created_at
                  type: DATETIME(6)
              - column:
                  name: user_id
                  type: BIGINT
              - column:
                  name: id_user_created
                  type: BIGINT
              - column:
                  name: id_user_updated
                  type: BIGINT
              - column:
                  name: id_user_deleted
                  type: BIGINT
              - column:
                  name: date_created
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: date_updated
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: date_deleted
                  type: TIMESTAMP
        - addUniqueConstraint:
            tableName: security_code
            columnNames: uuid
            constraintName: uk_security_code_uuid
        - addForeignKeyConstraint:
            baseTableName: security_code
            baseColumnNames: user_id
            referencedTableName: auth_users
            referencedColumnNames: id
            constraintName: fk_security_code_user
      rollback:
        - dropForeignKeyConstraint:
            baseTableName: security_code
            constraintName: fk_security_code_user
        - dropTable:
            tableName: security_code

  - changeSet:
      id: 2026-09-19-security-code-used-boolean-postgresql
      author: TaielMG
      comment: En PostgreSQL TINYINT(1) queda como smallint y la entidad espera boolean; se convierte a boolean
      dbms: postgresql
      changes:
        - sql:
            sql: ALTER TABLE security_code ALTER COLUMN used TYPE boolean USING used <> 0

