# Schema de core-identity: usuarios, roles, permisos y codigos de seguridad.
# No incluye empresas: eso lo aporta core-multiempresa.
databaseChangeLog:
  - changeSet:
      id: 2026-07-06-create-initial-schema-2
      author: TaielMG
      comment: Crea tabla auth_permissions
      preConditions:
        onFail: MARK_RAN
        not:
          - tableExists:
              tableName: auth_permissions
      changes:
        - createTable:
            tableName: auth_permissions
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
              - column:
                  name: status
                  type: TINYINT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: uuid
                  type: CHAR(36)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: VARCHAR(255)
              - column:
                  name: id_user_created
                  type: BIGINT
              - column:
                  name: id_user_updated
                  type: BIGINT
              - column:
                  name: id_user_deleted
                  type: BIGINT
              - column:
                  name: date_created
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: date_updated
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: date_deleted
                  type: TIMESTAMP
        - addUniqueConstraint:
            tableName: auth_permissions
            columnNames: uuid
            constraintName: uk_auth_permissions_uuid
      rollback:
        - dropTable:
            tableName: auth_permissions


