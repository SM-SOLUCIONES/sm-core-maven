# Publica una version del Core en el repositorio Maven publico https://sm-soluciones.github.io/sm-core-maven.
#
# Se dispara al pushear un tag v{version} (ej. v4.0.0) que coincide con el <version> y el core.version del pom raiz.
# Compila, corre los tests y hace "mvn deploy" a la rama gh-pages, que GitHub Pages sirve como repositorio Maven.
# Una version ya publicada no se pisa: el workflow falla y hay que publicar una version nueva.
name: Publicar

on:
  push:
    tags: ['v*']

concurrency:
  group: publicar
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: El tag coincide con la version del pom
        run: |
          version="$(mvn -B -q help:evaluate -Dexpression=project.version -DforceStdout)"
          core="$(mvn -B -q help:evaluate -Dexpression=core.version -DforceStdout)"
          echo "Tag: ${GITHUB_REF_NAME} | <version>: ${version} | core.version: ${core}"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ] || [ "${version}" != "${core}" ]; then
            echo "::error::El tag tiene que ser v<version> y core.version tiene que ser igual a <version> (ver README -> Publicar una version)"
            exit 1
          fi
          echo "VERSION=${version}" >> "$GITHUB_ENV"

      - name: Traer la rama gh-pages (el repositorio Maven publicado)
        run: |
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null; then
            git clone --depth 1 --branch gh-pages "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" repo-maven
          else
            mkdir repo-maven
            git -C repo-maven init -b gh-pages
            git -C repo-maven remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
            touch repo-maven/.nojekyll
          fi

      - name: La version no esta publicada
        run: |
          if [ -d "repo-maven/com/blue/open/core-parent/${VERSION}" ]; then
            echo "::error::La version ${VERSION} ya esta publicada. Una version publicada no se pisa: subir la version."
            exit 1
          fi

      - name: Compilar, testear y publicar en repo-maven
        run: mvn -B -Ppublicar deploy -DaltDeploymentRepository=sm-core::file://${{ github.workspace }}/repo-maven

      - name: Pushear gh-pages
        run: |
          cd repo-maven
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publica core ${VERSION}"
          git push origin gh-pages
