                  constraints:
                    nullable: false
              - column:
                  name: uuid
                  type: CHAR(36)
                  constraints:
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
              - column:
                  name: company_id
                  type: BIGINT
              - column:
                  name: id_user_created
                  type: BIGINT
              - column:
                  name: id_user_updated
                  type: BIGINT
              - column:
                  name: id_user_deleted
                  type: BIGINT
              - column:
                  name: date_created
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: date_updated
