  # Roles y permisos en espanol (glosario, ticket 05). core-identity renombra auth_roles.company_id a id_empresa
  # antes de que corra este changelog. En una base nueva este changeset crea la FK sobre id_empresa con el nombre de
  # siempre [D15], y core-multiempresa-fk-auth-roles-company (que nombra company_id) queda MARK_RAN por su
  # precondicion. En una base existente la FK ya existe (sigue a la columna renombrada) y este queda MARK_RAN.
  # Su rollback no hace nada: Liquibase tambien revierte los changesets MARK_RAN, y la FK la borra el rollback de
  # core-multiempresa-fk-auth-roles-company (en una base nueva queda MARK_RAN despues de este, asi que se revierte antes).
  - changeSet:
      id: 2026-10-09-fk-auth-roles-id-empresa
      author: TaielMG
      comment: Agrega la FK de auth_roles.id_empresa a companies si todavia no existe
      preConditions:
        - onFail: MARK_RAN
        - columnExists:
            tableName: auth_roles
            columnName: id_empresa
        - not:
            - foreignKeyConstraintExists:
                foreignKeyName: fk_auth_roles_company
      changes:
        - addForeignKeyConstraint:
            baseTableName: auth_roles
            baseColumnNames: id_empresa
            referencedTableName: companies
            referencedColumnNames: id
            constraintName: fk_auth_roles_company
      rollback:
        - output:
            message: Sin efecto. La FK la borra el rollback de core-multiempresa-fk-auth-roles-company

  - changeSet:
      id: core-multiempresa-fk-auth-roles-company
      author: TaielMG
      comment: Agrega la FK de auth_roles.company_id a companies. La columna la crea core-identity sin FK, para que un proyecto mono-empresa pueda tenerla en null sin depender de este modulo.
      preConditions:
        onFail: MARK_RAN
        not:
          - foreignKeyConstraintExists:
              foreignKeyName: fk_auth_roles_company
      changes:
        - addForeignKeyConstraint:
            baseTableName: auth_roles
            baseColumnNames: company_id
            referencedTableName: companies
            referencedColumnNames: id
            constraintName: fk_auth_roles_company
      rollback:
        - dropForeignKeyConstraint:
            baseTableName: auth_roles
            constraintName: fk_auth_roles_company

