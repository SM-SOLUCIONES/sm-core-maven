# Schema de core-multiempresa: empresas y el scoping de roles por empresa.
# Un proyecto mono-empresa no incluye este changelog y no crea estas tablas.
databaseChangeLog:
  - changeSet:
      id: 2026-07-06-create-initial-schema-1
      author: TaielMG
      comment: Crea tabla companies
      preConditions:
        onFail: MARK_RAN
        not:
          - tableExists:
              tableName: companies
      changes:
        - createTable:
            tableName: companies
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
              - column:
                  name: status
                  type: TINYINT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: uuid
                  type: CHAR(36)
                  constraints:
                    nullable: false
              - column:
                  name: code
                  type: VARCHAR(255)
              - column:
                  name: path
                  type: VARCHAR(255)
              - column:
                  name: balance
                  type: DOUBLE
              - column:
                  name: description
                  type: VARCHAR(255)
              - column:
                  name: id_user_created
                  type: BIGINT
              - column:
                  name: id_user_updated
                  type: BIGINT
              - column:
                  name: id_user_deleted
                  type: BIGINT
              - column:
                  name: date_created
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: date_updated
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: date_deleted
                  type: TIMESTAMP
        - addUniqueConstraint:
            tableName: companies
            columnNames: uuid
            constraintName: uk_companies_uuid
      rollback:
        - dropTable:
            tableName: companies


  # Usuarios en espanol (glosario, ticket 06). core-identity renombra auth_users a auth_usuarios antes de que corra
  # este changelog. En una base nueva este changeset crea auth_users_companies con la FK hacia auth_usuarios (el
  # nombre de la FK queda [D15]) y 2026-07-06-create-initial-schema-6, que la apunta a auth_users, queda MARK_RAN por su
  # precondicion. En una base existente la tabla ya existe (su FK sigue a la tabla renombrada) y este queda MARK_RAN.
  # Su rollback no hace nada: Liquibase tambien revierte los changesets MARK_RAN, y la tabla la borra el rollback de
  # 2026-07-06-create-initial-schema-6 (en una base nueva queda MARK_RAN despues de este, asi que se revierte antes).
  - changeSet:
      id: 2026-10-09-create-auth-users-companies-fk-auth-usuarios
      author: TaielMG
      comment: Crea tabla auth_users_companies con la FK hacia auth_usuarios (base nueva)
      preConditions:
        - onFail: MARK_RAN
        - tableExists:
            tableName: auth_usuarios
        - not:
            - tableExists:
                tableName: auth_users_companies
      changes:
        - createTable:
            tableName: auth_users_companies
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: status
                  type: TINYINT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: uuid
                  type: CHAR(36)
                  constraints:
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
              - column:
                  name: company_id
                  type: BIGINT
              - column:
                  name: id_user_created
                  type: BIGINT
              - column:
                  name: id_user_updated
                  type: BIGINT
              - column:
                  name: id_user_deleted
                  type: BIGINT
              - column:
                  name: date_created
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: date_updated
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: date_deleted
                  type: TIMESTAMP
        - addUniqueConstraint:
            tableName: auth_users_companies
            columnNames: uuid
            constraintName: uk_auth_users_companies_uuid
        - addForeignKeyConstraint:
            baseTableName: auth_users_companies
            baseColumnNames: user_id
            referencedTableName: auth_usuarios
            referencedColumnNames: id
            constraintName: fk_auth_users_companies_user
        - addForeignKeyConstraint:
            baseTableName: auth_users_companies
            baseColumnNames: company_id
            referencedTableName: companies
            referencedColumnNames: id
            constraintName: fk_auth_users_companies_company
      rollback:
        - output:
            message: Sin efecto. La tabla la borra el rollback de 2026-07-06-create-initial-schema-6

  - changeSet:
