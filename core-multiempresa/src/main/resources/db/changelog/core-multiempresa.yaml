  # Multiempresa en espanol (glosario, ticket 07). Las FKs, PKs y constraints conservan su nombre [D15], y las FKs
  # siguen a las tablas y columnas renombradas. Ningun modulo que corre despues de este changelog crea una FK hacia
  # estas tablas: en una base nueva se crean con el nombre viejo y se renombran aca. La columna cuit de empresas es
  # del proyecto y la migra el changelog del proyecto.

  - changeSet:
      id: 2026-10-09-renombrar-empresas-y-relaciones-1
      author: TaielMG
      comment: Renombra la tabla companies a empresas
      preConditions:
        onFail: MARK_RAN
        tableExists:
          tableName: companies
      changes:
        - renameTable:
            oldTableName: companies
            newTableName: empresas
      rollback:
        - renameTable:
            oldTableName: empresas
            newTableName: companies

